# Builds the desktop apps. Push a version tag to publish a release with them attached:
#   git tag v1.0.0 && git push origin v1.0.0
# "Run workflow" on the Actions tab builds without releasing (download them from the run page).
# Each app is the Electron window (electron/) with the PyInstaller-built Python backend inside it.
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest          # Apple Silicon
          - os: ubuntu-22.04          # oldest supported glibc = runs on the most distros
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
          pyinstaller astrobake.spec
          dist/astrobake-backend/astrobake-backend --help > /dev/null

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: electron/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml
      - name: Build the app
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # not signed with a paid certificate
        run: |
          pnpm install --frozen-lockfile
          version=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          pnpm exec electron-builder --publish never -c.extraMetadata.version="$version"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: electron/dist
        run: |
          # ad-hoc signature: Apple Silicon refuses to run an unsigned app ("damaged") rather than warn
          codesign --force --deep --sign - mac-arm64/Astrobake.app
          ditto -c -k --keepParent mac-arm64/Astrobake.app Astrobake-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            electron/dist/Astrobake-Windows-Setup.exe
            electron/dist/Astrobake-macOS.zip
            electron/dist/Astrobake-Linux-*.AppImage
            electron/dist/Astrobake-Linux-*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
