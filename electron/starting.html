<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Astrobake</title>
<style>
html,body{height:100%;margin:0}
body{background:#111111;color:#9a9a9a;font:14px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
     display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
h1{color:#ececec;font-size:20px;font-weight:500;margin:0}
.bar{width:160px;height:2px;background:#2e2e2e;overflow:hidden;border-radius:1px}
.bar::after{content:"";display:block;width:40%;height:100%;background:#e4e4e4;animation:s 1.2s ease-in-out infinite}
@keyframes s{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.bar::after{animation:none;width:100%;opacity:.4}}
</style></head>
<body><h1>Astrobake</h1><div class="bar"></div><div>Starting…</div></body></html>
